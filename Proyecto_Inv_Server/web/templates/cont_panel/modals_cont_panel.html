<div class="modal fade" id="modalAlertaGeneral" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <!-- MODIFICACIÓN AQUÍ: Sombra grande, borde sutil y sombra difuminada más intensa -->
        <div class="modal-content border shadow-lg rounded-4" style="box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.35) !important; border-color: rgba(0,0,0,0.1) !important;">
            <div class="modal-body text-center p-4">
                
                <!-- ICONOS DINÁMICOS SEGÚN EL TIPO DE ALERTA -->
                <!-- 1. Faltan Datos / Advertencia (Warning) -->
                <template x-if="alerta.tipo === 'warning'">
                    <div class="text-warning mb-3">
                        <svg width="48" height="48" fill="currentColor" class="bi bi-exclamation-circle-fill" viewBox="0 0 16 16">
                            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM8 4a.905.905 0 0 0-.9.995l.35 3.507a.552.552 0 0 0 1.1 0l.35-3.507A.905.905 0 0 0 8 4zm.002 6a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/>
                        </svg>
                    </div>
                </template>

                <!-- 2. Errores (Danger) -->
                <template x-if="alerta.tipo === 'danger'">
                    <div class="text-danger mb-3">
                        <svg width="48" height="48" fill="currentColor" class="bi bi-x-circle-fill" viewBox="0 0 16 16">
                            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293 5.354 4.646z"/>
                        </svg>
                    </div>
                </template>

                <!-- 3. Confirmación / Pregunta (Confirm) -->
                <template x-if="alerta.tipo === 'confirm'">
                    <div class="text-primary mb-3">
                        <svg width="48" height="48" fill="currentColor" class="bi bi-question-circle-fill" viewBox="0 0 16 16">
                            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM5.496 6.033h.825c.138 0 .248-.113.266-.25.09-.656.54-1.134 1.342-1.134.686 0 1.314.343 1.314 1.168 0 .635-.374.927-.965 1.371-.673.489-1.206 1.06-1.168 1.987l.003.217a.25.25 0 0 0 .25.246h.811a.25.25 0 0 0 .25-.25v-.105c0-.718.273-.927 1.01-1.486.609-.463 1.244-.977 1.244-2.056 0-1.511-1.276-2.241-2.673-2.241-1.267 0-2.655.59-2.75 2.286a.237.237 0 0 0 .241.247zm2.325 6.443c.6 0 1.057-.438 1.057-1.054 0-.624-.457-1.06-1.057-1.06-.61 0-1.068.436-1.068 1.06 0 .616.458 1.054 1.068 1.054z"/>
                        </svg>
                    </div>
                </template>

                <!-- 4. Éxito / Guardado Correcto (Success) -->
                <template x-if="alerta.tipo === 'success'">
                    <div class="text-success mb-3">
                        <svg width="48" height="48" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                        </svg>
                    </div>
                </template>

                <!-- TEXTOS DINÁMICOS -->
                <h5 class="fw-bold text-dark mb-2" x-text="alerta.titulo"></h5>
                <p class="text-muted small mb-4" x-text="alerta.mensaje"></p>

                <!-- BOTONES DE ACCIÓN -->
                <div class="d-flex justify-content-center gap-2">
                    <template x-if="alerta.tipo === 'confirm'">
                        <button type="button" class="btn btn-sm btn-light border px-3" data-bs-dismiss="modal">Cancelar</button>
                    </template>

                    <button type="button" 
                            class="btn btn-sm px-4 fw-medium text-white" 
                            :class="{
                                'btn-warning text-dark': alerta.tipo === 'warning',
                                'btn-danger': alerta.tipo === 'danger',
                                'btn-success': alerta.tipo === 'success',
                                'btn-primary': alerta.tipo === 'confirm'
                            }"
                            @click="alerta.tipo === 'confirm' || alerta.tipo === 'success' ? confirmarAccion() : cerrarAlertaUnica()"
                            x-text="alerta.textoBoton">
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>
