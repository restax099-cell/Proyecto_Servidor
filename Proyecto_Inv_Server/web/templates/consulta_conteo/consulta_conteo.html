{% extends 'cont_panel/base_conteo.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/styles_consulta_conteo.css' %}">
{% endblock %}

{% block content_panel %}
<div x-data="inventoryApp()" class="container-fluid px-4 py-3" style="background-color: #f1f5f9; min-height: 100vh;">

    <!-- BARRA SUPERIOR -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center gap-2">
            <span class="text-muted small">Inventarios &rsaquo;</span>
            <h6 class="fw-bold text-dark mb-0" style="font-size: 1.05rem;">Revisión de Conteos Físicos</h6>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-sm btn-light border px-3 fw-semibold text-dark rounded-1 shadow-sm bg-white" @click="resetSelection()">Limpiar selección</button>
            <button class="btn btn-sm btn-dark px-3 fw-semibold rounded-1 shadow-sm" style="background-color: #0f172a;">Aprobar Conteo</button>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL GRID / FLEX -->
    <div class="row g-3">
        
        <!-- COLUMNA IZQUIERDA: BANDEJA DE CONTEOS -->
        <div class="col-12 col-lg-4 col-xl-3">
            <div class="bg-white rounded-1 border border-secondary-subtle p-3 shadow-sm">
                
                <!-- Buscador -->
                <div class="mb-2">
                    <input type="text" 
                            class="form-control form-control-sm search-input rounded-1 px-3 py-2 fw-medium" 
                            placeholder="Buscar por código, título o estado..." 
                            x-model="searchQuery">
                </div>

                <!-- Filtros por Estado (Pills) -->
                <div class="d-flex gap-1 mb-3 overflow-x-auto pb-1" style="font-size: 0.72rem; scrollbar-width: none;">
                    <button type="button" 
                            class="btn btn-sm rounded-pill px-2 py-1 fw-bold text-nowrap border-0"
                            :class="statusFilter === 'Todos' ? 'btn-dark text-white' : 'btn-light text-secondary border'"
                            @click="statusFilter = 'Todos'">
                        Todos
                    </button>
                    <button type="button" 
                            class="btn btn-sm rounded-pill px-2 py-1 fw-bold text-nowrap border-0"
                            :class="statusFilter === 'Completo' ? 'badge-soft-success' : 'btn-light text-secondary border'"
                            @click="statusFilter = 'Completo'">
                        Completo
                    </button>
                    <button type="button" 
                            class="btn btn-sm rounded-pill px-2 py-1 fw-bold text-nowrap border-0"
                            :class="statusFilter === 'Incompleto' ? 'badge-soft-warning' : 'btn-light text-secondary border'"
                            @click="statusFilter = 'Incompleto'">
                        Incompleto
                    </button>
                    <button type="button" 
                            class="btn btn-sm rounded-pill px-2 py-1 fw-bold text-nowrap border-0"
                            :class="statusFilter === 'Sin revisar' ? 'badge-soft-secondary' : 'btn-light text-secondary border'"
                            @click="statusFilter = 'Sin revisar'">
                        Sin revisar
                    </button>
                </div>

                <!-- Lista de Conteos -->
                <div class="conteos-list">
                    <template x-for="count in filteredCounts" :key="count.id">
                        <div class="count-card p-3 mb-2 rounded-1" 
                                :class="{ 'active': selectedCount && selectedCount.id === count.id }"
                                @click="selectCount(count)">
                            <div class="d-flex justify-content-between align-items-start mb-1">
                                <h6 class="mb-0 fw-bold title-text" style="font-size: 1rem;" x-text="count.code + ' · ' + count.title"></h6>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mt-2">
                                <span style="font-size: 0.95rem;" class="fw-medium date-text" x-text="formatDate(count.date)"></span>
                                <span class="badge fw-bold px-2 py-1" 
                                    :class="getStatusBadgeClass(count.status)"
                                    style="font-size: 0.75rem;"
                                    x-text="count.status">
                                </span>
                            </div>
                        </div>
                    </template>
                    
                    <div x-show="filteredCounts.length === 0" class="text-center p-4 text-muted">
                        <p class="small mb-0 fw-medium">No se encontraron conteos.</p>
                    </div>
                </div>

            </div>
        </div>

        <!-- COLUMNA DERECHA: PANEL DE DETALLES -->
        <div class="col-12 col-lg-8 col-xl-9">
            
            <!-- ESTADO VACÍO -->
            <template x-if="!selectedCount">
                <div class="bg-white rounded-1 border border-secondary-subtle p-5 text-center shadow-sm" style="min-height: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <svg width="48" height="48" fill="none" stroke="#64748b" viewBox="0 0 24 24" class="mb-2"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <h6 class="fw-bold text-dark mb-1">Ningún conteo seleccionado</h6>
                    <p class="small text-muted mb-0 fw-medium">Selecciona un elemento de la lista para ver sus detalles</p>
                </div>
            </template>

            <!-- SI HAY UN CONTEO SELECCIONADO -->
            <template x-if="selectedCount">
                <div class="d-flex flex-column gap-3">
                    
                    <!-- TARJETA SUPERIOR: ENCABEZADO Y METADATOS -->
                    <div class="bg-white rounded-1 border border-secondary-subtle p-3 p-lg-4 shadow-sm">
                        <span class="d-block text-label text-uppercase fw-bold mb-1" style="font-size: 0.7rem; letter-spacing: 0.8px;">DETALLE DEL CONTEO</span>
                        <h5 class="fw-bold text-dark mb-3" style="font-size: 1.15rem;" x-text="selectedCount.code + ' · ' + selectedCount.title"></h5>

                        <!-- BLOQUES DE METADATOS (Grid de 12 columnas Bootstrap) -->
                        <div class="row g-2 mb-2">
                            <div class="col-6 col-md-2">
                                <div class="p-2 px-3 rounded-1 border bg-light border-secondary-subtle h-100">
                                    <span class="d-block text-label text-uppercase mb-1" style="font-size: 0.65rem;">CLAVE</span>
                                    <span class="text-value d-block" style="font-size: 1.5rem;" x-text="selectedCount.code"></span>
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="p-2 px-3 rounded-1 border bg-light border-secondary-subtle h-100">
                                    <span class="d-block text-label text-uppercase mb-1" style="font-size: 0.65rem;">FECHA DE REGISTRO</span>
                                    <span class="text-value d-block" style="font-size: 1.5rem;" x-text="formatDate(selectedCount.date)"></span>
                                </div>
                            </div>
                            <div class="col-12 col-md-4">
                                <div class="p-2 px-3 rounded-1 border bg-light border-secondary-subtle h-100">
                                    <span class="d-block text-label text-uppercase mb-1" style="font-size: 0.65rem;">RESPONSABLE</span>
                                    <span class="text-value d-block" style="font-size: 1.5rem;" x-text="selectedCount.assignee || 'Sin asignar'"></span>
                                </div>
                            </div>
                            <div class="col-12 col-md-3">
                                <div class="p-2 px-3 rounded-1 border bg-light border-secondary-subtle h-100 d-flex flex-column justify-content-between">
                                    <span class="d-block text-label text-uppercase mb-1" style="font-size: 0.65rem;">ESTADO</span>
                                    <div>
                                        <span class="badge rounded-pill fw-bold px-2 py-1" 
                                                :class="getStatusBadgeClass(selectedCount.status)"
                                                style="font-size: 0.80rem;"
                                                x-text="selectedCount.status"></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- INDICADORES FINANCIEROS -->
                        <div class="row g-2">
                            <div class="col-6 col-md-2">
                                <div class="p-2 px-3 rounded-1 border bg-light border-secondary-subtle">
                                    <span class="text-label text-uppercase d-block mb-1" style="font-size: 0.65rem;">VALOR TOTAL CONTADO</span>
                                    <h6 class="fw-bold mb-0 text-value" style="font-size: 1.5rem;" x-text="formatCurrency(calculateTotalValue())"></h6>
                                </div>
                            </div>
                            <div class="col-6 col-md-2">
                                <div class="p-2 px-3 rounded-1 border bg-light border-secondary-subtle">
                                    <span class="text-label text-uppercase d-block mb-1" style="font-size: 0.65rem;">TOTAL DE PRODUCTOS</span>
                                    <h6 class="fw-bold mb-0 text-value" style="font-size: 1.5rem;" x-text="selectedCount.products.length + ' SKUs'"></h6>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TARJETA INFERIOR: DESGLOSE POR CATEGORÍAS -->
                    <div class="bg-white rounded-1 border border-secondary-subtle p-3 p-lg-4 shadow-sm">
                        <span class="d-block text-label text-uppercase fw-bold mb-3" style="font-size: 0.7rem; letter-spacing: 0.8px;">DESGLOSE DE MERCANCÍA POR CATEGORÍA</span>

                        <div class="d-flex flex-column gap-3">
                            <template x-for="(products, category) in getGroupedProducts()" :key="category">
                                <div class="border border-secondary-subtle rounded-1 overflow-hidden" x-data="{ isOpen: true }">
                                    <!-- Cabecera de Categoría (Acordeón) -->
                                    <div class="px-3 py-2 border-bottom border-secondary-subtle d-flex justify-content-between align-items-center bg-light" 
                                            style="cursor: pointer; user-select: none;"
                                            @click="isOpen = !isOpen">
                                        <div class="d-flex align-items-center gap-2">
                                            <svg width="14" height="14" fill="none" stroke="#0f172a" viewBox="0 0 24 24" 
                                                    style="transition: transform 0.2s ease;"
                                                    :style="isOpen ? 'transform: rotate(180deg);' : 'transform: rotate(0deg);'">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
                                            </svg>
                                            <span class="fw-bold text-dark text-uppercase" style="font-size: 0.8rem; letter-spacing: 0.5px;" x-text="category"></span>
                                        </div>
                                        <span class="badge border border-secondary-subtle rounded-pill fw-bold px-2 py-1 bg-white text-dark" style="font-size: 0.68rem;" x-text="products.length + ' ítems'"></span>
                                    </div>

                                    <!-- Tabla de Productos Estilo ERP -->
                                    <div class="table-responsive mb-0" x-show="isOpen" x-transition>
                                        <table class="table table-sm mb-0 align-middle table-erp">
                                            <thead>
                                                <tr class="text-dark border-bottom" style="font-size: 1.5rem; font-weight: 700; background-color: transparent !important;">
                                                    <th class="ps-3 py-2 border-0 bg-transparent" style="width: 15%;">SKU</th>
                                                    <th class="py-2 border-0 bg-transparent" style="width: 45%;">Descripción</th>
                                                    <th class="text-end py-2 border-0 bg-transparent" style="width: 13%;">Cant. contada</th>
                                                    <th class="text-end py-2 border-0 bg-transparent" style="width: 13%;">Precio unit.</th>
                                                    <th class="text-end pe-3 py-2 border-0 bg-transparent" style="width: 14%;">Total</th>
                                                </tr>
                                            </thead>
                                            <tbody class="border-0">
                                                <template x-for="product in products" :key="product.sku">
                                                    <tr class="border-bottom border-secondary-subtle">
                                                        <!-- SKU -->
                                                        <td class="ps-2 py-1 border-0">
                                                            <span
                                                                class="badge text-secondary border px-2 py-1 fw-medium bg-white rounded-1"
                                                                style="font-size: 1rem; border-color: #cbd5e1 !important;"
                                                                x-text="product.sku">
                                                            </span>
                                                        </td>
                                                        <!-- Descripción -->
                                                        <td
                                                            class="py-1 fw-semibold text-dark border-0"
                                                            style="font-size: 1rem;"
                                                            x-text="product.description">
                                                        </td>

                                                        <!-- Cantidad -->
                                                        <td
                                                            class="text-end py-1 fw-normal text-dark border-0"
                                                            style="font-size: 1rem; font-variant-numeric: tabular-nums;"
                                                            x-text="product.qty">
                                                        </td>

                                                        <!-- Precio unitario -->
                                                        <td
                                                            class="text-end py-1 fw-normal text-secondary border-0"
                                                            style="font-size: 1rem; font-variant-numeric: tabular-nums;"
                                                            x-text="formatCurrency(product.price)">
                                                        </td>

                                                        <!-- Total -->
                                                        <td
                                                            class="text-end pe-2 py-1 fw-semibold text-dark border-0"
                                                            style="font-size: 1rem; font-variant-numeric: tabular-nums;"
                                                            x-text="formatCurrency(product.qty * product.price)">
                                                        </td>
                                                    </tr>
                                                </template>
                                           

                                            </tbody>

                                        </table>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                </div>
            </template>

        </div>

    </div>
</div>
{% endblock %}
{% block extra_scripts %}
    <script type="module" src="{% static 'js/app_consulta_conteo/app_consulta_conteo.js' %}"></script>
{% endblock %}
