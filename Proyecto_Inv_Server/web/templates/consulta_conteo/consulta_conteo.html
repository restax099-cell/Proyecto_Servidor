{% extends 'cont_panel/base_conteo.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/styles_consulta_conteo.css' %}">
{% endblock %}

{% block content_panel %}
<div x-data="inventoryApp()" style="background-color: #f1f5f9;">

    <div class="container-fluid d-flex flex-column h-100 p-3 p-lg-4">
            
        <!-- BARRA SUPERIOR -->
        <div class="d-flex justify-content-between align-items-center mb-3 px-1 flex-shrink-0">
            <div class="d-flex align-items-center gap-2">
                <span class="text-label small">Inventarios &rsaquo;</span>
                <h6 class="fw-bold text-dark mb-0" style="font-size: 1.05rem;">Revisión de Conteos Físicos</h6>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-light border px-3 fw-semibold text-dark rounded-3 shadow-sm bg-white" @click="resetSelection()">Limpiar selección</button>
                <button class="btn btn-sm btn-dark px-3 fw-semibold rounded-3 shadow-sm" style="background-color: #0f172a;">Aprobar Conteo</button>
            </div>
        </div>

        <!-- CONTENEDOR PRINCIPAL FLEX -->
        <div class="d-flex flex-column flex-lg-row gap-3 flex-grow-1 overflow-hidden">
            
            <!-- COLUMNA IZQUIERDA: BANDEJA DE CONTEOS -->
            <div class="h-100 w-100 flex-shrink-0" style="max-width: 320px;">
                <div class="bg-white rounded-4 shadow-sm border border-slate-200 d-flex flex-column h-100 p-3">
                    
                    <!-- Buscador -->
                    <div class="mb-2">
                        <input type="text" 
                                class="form-control form-control-sm search-input rounded-3 px-3 py-2 fw-medium" 
                                style="font-size: 0.85rem;"
                                placeholder="Buscar por código, título o estado..." 
                                x-model="searchQuery">
                    </div>

                    <!-- Filtros por Estado (Pills) -->
                    <div class="d-flex gap-1 mb-3 overflow-x-auto pb-1" style="font-size: 0.72rem; scrollbar-width: none;">
                        <button type="button" 
                                class="btn btn-sm rounded-pill px-2 py-1 fw-bold text-nowrap border-0"
                                :class="statusFilter === 'Todos' ? 'btn-dark text-white' : 'btn-light text-secondary border'"
                                style="font-size: 0.72rem;"
                                @click="statusFilter = 'Todos'">
                            Todos
                        </button>
                        <button type="button" 
                                class="btn btn-sm rounded-pill px-2 py-1 fw-bold text-nowrap border-0"
                                :class="statusFilter === 'Completo' ? 'badge-soft-success' : 'btn-light text-secondary border'"
                                style="font-size: 0.72rem;"
                                @click="statusFilter = 'Completo'">
                            Completo
                        </button>
                        <button type="button" 
                                class="btn btn-sm rounded-pill px-2 py-1 fw-bold text-nowrap border-0"
                                :class="statusFilter === 'Incompleto' ? 'badge-soft-warning' : 'btn-light text-secondary border'"
                                style="font-size: 0.72rem;"
                                @click="statusFilter = 'Incompleto'">
                            Incompleto
                        </button>
                        <button type="button" 
                                class="btn btn-sm rounded-pill px-2 py-1 fw-bold text-nowrap border-0"
                                :class="statusFilter === 'Sin revisar' ? 'badge-soft-secondary' : 'btn-light text-secondary border'"
                                style="font-size: 0.72rem;"
                                @click="statusFilter = 'Sin revisar'">
                            Sin revisar
                        </button>
                    </div>

                    <!-- Lista de Conteos (Scrollable) -->
                    <div class="scrollable-column flex-grow-1 pe-1">
                        <template x-for="count in filteredCounts" :key="count.id">
                            <div class="count-card p-3 mb-2 rounded-3" 
                                    :class="{ 'active': selectedCount && selectedCount.id === count.id }"
                                    @click="selectCount(count)">
                                <div class="d-flex justify-content-between align-items-start mb-1">
                                    <h6 class="mb-0 fw-bold" style="font-size: 0.88rem; color: #0f172a;" x-text="count.code + ' · ' + count.title"></h6>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mt-2">
                                    <span style="font-size: 0.78rem; color: #475569;" class="fw-medium" x-text="formatDate(count.date)"></span>
                                    <span class="badge rounded-pill fw-bold px-2 py-1" 
                                            :class="getStatusBadgeClass(count.status)"
                                            style="font-size: 0.72rem;"
                                            x-text="count.status"></span>
                                </div>
                            </div>
                        </template>
                        
                        <div x-show="filteredCounts.length === 0" class="text-center p-4 text-muted">
                            <p class="small mb-0 fw-medium">No se encontraron conteos.</p>
                        </div>
                    </div>

                </div>
            </div>

            <!-- COLUMNA DERECHA: PANEL DE DETALLES -->
            <div class="flex-grow-1 h-100 w-100 overflow-hidden">
                
                <!-- ESTADO VACÍO -->
                <template x-if="!selectedCount">
                    <div class="bg-white rounded-4 shadow-sm border border-slate-200 h-100 d-flex flex-column align-items-center justify-content-center p-4">
                        <svg width="48" height="48" fill="none" stroke="#64748b" viewBox="0 0 24 24" class="mb-2"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <h6 class="fw-bold text-dark mb-1">Ningún conteo seleccionado</h6>
                        <p class="small text-muted mb-0 fw-medium">Selecciona un elemento de la lista para ver sus detalles</p>
                    </div>
                </template>

                <!-- SI HAY UN CONTEO SELECCIONADO -->
                <template x-if="selectedCount">
                    <div class="d-flex flex-column gap-3 h-100 overflow-hidden">
                        
                        <!-- TARJETA SUPERIOR: ENCABEZADO Y METADATOS -->
                        <div class="bg-white rounded-4 shadow-sm border border-slate-200 p-3 p-lg-4 flex-shrink-0">
                            <!-- Micro Etiqueta de Sección -->
                            <span class="d-block text-label text-uppercase fw-bold mb-1" style="font-size: 0.72rem; letter-spacing: 0.8px;">DETALLE DEL CONTEO</span>
                            <h5 class="fw-bold text-dark mb-3" style="font-size: 1.2rem; letter-spacing: -0.2px;" x-text="selectedCount.code + ' · ' + selectedCount.title"></h5>

                            <!-- BLOQUES DE METADATOS -->
                            <div class="row g-2 mb-3">
                                <div class="col-6 col-md-3">
                                    <div class="p-2 px-3 rounded-3 border" style="background-color: #f8fafc; border-color: #cbd5e1 !important;">
                                        <span class="d-block text-label text-uppercase mb-1" style="font-size: 0.7rem; letter-spacing: 0.5px;">CLAVE</span>
                                        <span class="text-value" style="font-size: 0.88rem;" x-text="selectedCount.code"></span>
                                    </div>
                                </div>
                                <div class="col-6 col-md-3">
                                    <div class="p-2 px-3 rounded-3 border" style="background-color: #f8fafc; border-color: #cbd5e1 !important;">
                                        <span class="d-block text-label text-uppercase mb-1" style="font-size: 0.7rem; letter-spacing: 0.5px;">FECHA DE REGISTRO</span>
                                        <span class="text-value" style="font-size: 0.88rem;" x-text="formatDate(selectedCount.date)"></span>
                                    </div>
                                </div>
                                <div class="col-6 col-md-3">
                                    <div class="p-2 px-3 rounded-3 border" style="background-color: #f8fafc; border-color: #cbd5e1 !important;">
                                        <span class="d-block text-label text-uppercase mb-1" style="font-size: 0.7rem; letter-spacing: 0.5px;">RESPONSABLE</span>
                                        <span class="text-value" style="font-size: 0.88rem;" x-text="selectedCount.assignee || 'Sin asignar'"></span>
                                    </div>
                                </div>
                                <div class="col-6 col-md-3">
                                    <div class="p-2 px-3 rounded-3 border" style="background-color: #f8fafc; border-color: #cbd5e1 !important;">
                                        <span class="d-block text-label text-uppercase mb-1" style="font-size: 0.7rem; letter-spacing: 0.5px;">ESTADO</span>
                                        <span class="badge rounded-pill fw-bold px-2 py-1" 
                                                :class="getStatusBadgeClass(selectedCount.status)"
                                                style="font-size: 0.72rem;"
                                                x-text="selectedCount.status"></span>
                                    </div>
                                </div>
                            </div>

                            <!-- INDICADORES FINANCIEROS -->
                            <div class="row g-2">
                                <div class="col-6 col-md-4">
                                    <div class="p-2 px-3 rounded-3 border" style="background-color: #f8fafc; border-color: #cbd5e1 !important;">
                                        <span class="text-label text-uppercase d-block mb-1" style="font-size: 0.7rem; letter-spacing: 0.5px;">VALOR TOTAL CONTADO</span>
                                        <h6 class="fw-bold mb-0 text-value" style="font-size: 1.05rem;" x-text="formatCurrency(calculateTotalValue())"></h6>
                                    </div>
                                </div>
                                <div class="col-6 col-md-4">
                                    <div class="p-2 px-3 rounded-3 border" style="background-color: #f8fafc; border-color: #cbd5e1 !important;">
                                        <span class="text-label text-uppercase d-block mb-1" style="font-size: 0.7rem; letter-spacing: 0.5px;">TOTAL DE PRODUCTOS</span>
                                        <h6 class="fw-bold mb-0 text-value" style="font-size: 1.05rem;" x-text="selectedCount.products.length + ' SKUs'"></h6>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- TARJETA INFERIOR: DESGLOSE POR CATEGORÍAS EN ACORDEÓN -->
                        <div class="bg-white rounded-4 shadow-sm border border-slate-200 p-3 p-lg-4 flex-grow-1 d-flex flex-column overflow-hidden">
                            <span class="d-block text-label text-uppercase fw-bold mb-3" style="font-size: 0.72rem; letter-spacing: 0.8px;">DESGLOSE DE MERCANCÍA POR CATEGORÍA</span>

                            <div class="scrollable-column flex-grow-1 pe-1">
                                <template x-for="(products, category) in getGroupedProducts()" :key="category">
                                    <div class="border border-slate-300 rounded-3 overflow-hidden mb-3" x-data="{ isOpen: true }">
                                        <!-- Cabecera de Categoría (Acordeón) -->
                                        <div class="px-3 py-2 border-bottom d-flex justify-content-between align-items-center" 
                                                style="background-color: #f8fafc; cursor: pointer; user-select: none;"
                                                @click="isOpen = !isOpen">
                                            <div class="d-flex align-items-center gap-2">
                                                <svg width="16" height="16" fill="none" stroke="#0f172a" viewBox="0 0 24 24" 
                                                        style="transition: transform 0.2s ease;"
                                                        :style="isOpen ? 'transform: rotate(180deg);' : 'transform: rotate(0deg);'">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
                                                </svg>
                                                <span class="fw-bold text-dark text-uppercase" style="font-size: 0.82rem; letter-spacing: 0.5px;" x-text="category"></span>
                                            </div>
                                            <span class="badge bg-slate-200 text-dark border border-secondary-subtle rounded-pill fw-bold px-2 py-1" style="font-size: 0.72rem; background-color: #e2e8f0; color: #0f172a;" x-text="products.length + ' ítems'"></span>
                                        </div>

                                        <!-- Tabla de Productos (Contenido Plegable) -->
                                        <div class="table-responsive mb-0" x-show="isOpen" x-transition>
                                            <table class="table table-sm table-hover mb-0 align-middle">
                                                <thead style="background-color: #f1f5f9;">
                                                    <tr class="text-uppercase fw-bold" style="font-size: 0.72rem; color: #334155; letter-spacing: 0.5px;">
                                                        <th class="ps-3 py-2 border-0">SKU</th>
                                                        <th class="py-2 border-0">Descripción</th>
                                                        <th class="text-end py-2 border-0">Cant. Contada</th>
                                                        <th class="text-end py-2 border-0">Precio Unit.</th>
                                                        <th class="text-end pe-3 py-2 border-0">Total Fila</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <template x-for="product in products" :key="product.sku">
                                                        <tr>
                                                            <td class="ps-3 py-2">
                                                                <span class="badge text-dark border px-2 py-1 fw-bold" style="font-size: 0.75rem; background-color: #f8fafc; border-color: #cbd5e1 !important;" x-text="product.sku"></span>
                                                            </td>
                                                            <td class="py-2 fw-semibold text-dark" style="font-size: 0.82rem;" x-text="product.description"></td>
                                                            <td class="text-end py-2 fw-bold text-dark" style="font-size: 0.82rem;" x-text="product.qty"></td>
                                                            <td class="text-end py-2 fw-medium" style="font-size: 0.82rem; color: #475569;" x-text="formatCurrency(product.price)"></td>
                                                            <td class="text-end pe-3 py-2 fw-bold text-dark" style="font-size: 0.85rem;" x-text="formatCurrency(product.qty * product.price)"></td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                    </div>
                </template>

            </div>
        </div>
    </div>
</div>

{% endblock %}
{% block extra_scripts %}
    <script type="module" src="{% static 'js/app_consulta_conteo/app_consulta_conteo.js' %}"></script>
{% endblock %}
