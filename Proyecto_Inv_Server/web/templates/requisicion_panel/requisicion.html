{% extends 'requisicion_panel/base_requisicion.html' %}
{% load static %}
{% block content_panel %}
  
<div class="flex h-screen bg-slate-300 font-sans text-slate-800 overflow-hidden" x-data="almacenApp()">
    
  <div :class="selectedId ? 'hidden md:flex' : 'flex'" class="w-full md:w-[35%] lg:w-[30%] bg-slate-200 border-r border-slate-400 shadow-2xl flex-col z-20 transition-transform">
    
    <div class="p-4 md:p-6 border-b border-slate-400 bg-slate-200 shrink-0 shadow-sm z-10">
      <div class="flex items-center justify-between mb-5">
        <h1 class="text-xl md:text-2xl font-bold tracking-tight text-slate-800">Bandeja de Pedidos</h1>
        <div x-show="pendientesCount > 0" class="bg-rose-600 text-white text-xs font-bold px-2 py-1 rounded-full shadow-sm" x-text="`${pendientesCount} Nuevas`">
        </div>
      </div>

      <div class="space-y-3">
        <div class="relative">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input 
            type="text" 
            placeholder="Buscar folio o artículo..." 
            class="w-full bg-slate-300 border border-slate-400 rounded-xl py-3 pl-10 pr-4 text-[15px] focus:ring-2 focus:ring-slate-500 focus:bg-slate-100 transition-all outline-none shadow-inner"
            x-model="searchQuery"
          />
        </div>
        
        <div class="flex gap-2">
          <div class="relative flex-1">
            <select 
              class="w-full appearance-none bg-slate-300 border border-slate-400 rounded-xl py-2.5 pl-3 pr-8 text-sm font-medium focus:ring-2 focus:ring-slate-500 focus:bg-slate-100 text-slate-800 cursor-pointer outline-none shadow-inner"
              x-model="statusFilter"
            >
              <option value="Todos">Todos los estados</option>
              <option value="Pendiente">Pendientes</option>
              <option value="En Proceso">En Proceso</option>
              <option value="Finalizada">Finalizadas</option>
            </select>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-600 pointer-events-none"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          </div>
          
          <div class="relative flex-1">
            <select 
              class="w-full appearance-none bg-slate-300 border border-slate-400 rounded-xl py-2.5 pl-3 pr-8 text-sm font-medium focus:ring-2 focus:ring-slate-500 focus:bg-slate-100 text-slate-800 cursor-pointer outline-none shadow-inner"
              x-model="originFilter"
            >
              <option value="Todos">Todas las áreas</option>
              <option value="Cocina">Cocina</option>
              <option value="Cantina">Cantina</option>
              <option value="Mantenimiento">Mantenimiento</option>
            </select>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-600 pointer-events-none"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          </div>
        </div>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar bg-slate-200">
      
      <template x-if="filteredRequisitions.length === 0">
        <div class="text-center text-slate-500 mt-10">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mx-auto mb-3 opacity-40"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          <p class="font-medium">No se encontraron pedidos</p>
        </div>
      </template>

      <template x-for="req in filteredRequisitions" :key="req.id">
        <div 
          @click="selectedId = req.id"
          :class="selectedId === req.id ? 'border-slate-500 ring-2 ring-slate-400 bg-slate-50 shadow-lg scale-[1.02] z-10' : 'border-slate-400 bg-slate-100 hover:bg-slate-50 hover:shadow-md hover:border-slate-500'"
          class="relative p-4 rounded-2xl cursor-pointer transition-all duration-200 border overflow-hidden"
        >
          <div 
            :class="req.status === 'Pendiente' ? 'bg-amber-500/80' : (req.status === 'En Proceso' ? 'bg-indigo-500/80' : 'bg-teal-500/80')"
            class="absolute left-0 top-0 bottom-0 w-1.5"
          ></div>

          <template x-if="req.isNew">
            <div class="absolute top-4 right-4 w-3 h-3 bg-rose-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(244,63,94,0.6)]"></div>
          </template>
          
          <div class="flex justify-between items-start mb-2 pl-2">
            <h3 class="font-bold text-lg text-slate-800" x-text="req.id"></h3>
            <span 
              :class="req.status === 'Pendiente' ? 'bg-amber-200/60 text-amber-900 border-amber-300' : (req.status === 'En Proceso' ? 'bg-indigo-200/60 text-indigo-900 border-indigo-300' : 'bg-teal-200/60 text-teal-900 border-teal-300')"
              class="text-xs font-bold px-2.5 py-1 rounded-md border" 
              x-text="req.status">
            </span>
          </div>
          
          <div class="grid grid-cols-2 gap-2 text-sm text-slate-600 mt-3 pl-2">
            <div class="flex items-center gap-1.5">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
              <span class="truncate" x-text="req.origin"></span>
            </div>
          </div>
          <div class="mt-3 pt-3 border-t border-slate-300 pl-2 text-xs text-slate-500 font-medium" x-text="`Creado a las ${req.createdAt}`"></div>
        </div>
      </template>
    </div>
  </div>

  <div :class="!selectedId ? 'hidden md:flex' : 'flex'" class="w-full md:w-[65%] lg:w-[70%] flex-col relative bg-transparent">
    
    <template x-if="!selectedReq">
      <div class="flex-1 flex flex-col items-center justify-center text-slate-600">
        <div class="bg-slate-200 p-6 rounded-full shadow-inner mb-4 border border-slate-400">
          <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        </div>
        <h2 class="text-2xl font-semibold text-slate-800 mb-2">Ningún pedido seleccionado</h2>
        <p class="text-slate-600 max-w-sm text-center">Selecciona una requisición del panel izquierdo para comenzar a preparar los artículos.</p>
      </div>
    </template>

    <template x-if="selectedReq">
      <div class="flex-1 flex flex-col h-full relative overflow-hidden min-h-0">
        
        <div class="bg-slate-200 p-6 shadow-sm border-b border-slate-400 z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shrink-0">
  
          <div class="flex items-center gap-3">
            <button 
              class="md:hidden p-2 bg-slate-100 shadow-sm hover:shadow-md rounded-lg transition-colors border border-slate-400"
              @click="selectedId = null"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div>
              <h2 class="text-3xl font-extrabold text-slate-800 tracking-tight" x-text="selectedReq.id"></h2>
              <div class="flex items-center gap-2 mt-1 text-sm text-slate-600 font-medium">
                <span x-text="selectedReq.origin"></span>
                <span>•</span>
                <span x-text="selectedReq.createdAt"></span>
              </div>
            </div>
          </div>

          <button 
            @click="printRequisition(selectedReq.db_id)" 
            class="flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-white text-slate-700 hover:text-indigo-700 font-bold rounded-xl border border-slate-400 shadow-sm transition-all duration-200 hover:-translate-y-0.5"
            title="Imprimir Pedido"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>
            <span class="hidden sm:inline">Imprimir</span>
          </button>

        </div>

        <div class="bg-slate-200 px-6 py-4 border-b border-slate-400 shrink-0 shadow-sm z-0">
          <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-slate-800 text-lg">Artículos Completados</span>
            <span 
              :class="orderStatus === 'complete' ? 'text-emerald-700' : 'text-slate-600'" 
              class="font-bold text-lg"
              x-text="`${selectedReq.items.filter(i => i.supplied_qty === i.requested_qty).length} / ${selectedReq.items.length}`">
            </span>
          </div>
          <div class="w-full bg-slate-400 border border-slate-500/50 rounded-full h-3.5 overflow-hidden shadow-inner">
            <div 
              :class="orderStatus === 'complete' ? 'bg-emerald-600' : (orderStatus === 'partial' ? 'bg-amber-500' : 'bg-slate-600')"
              class="h-3.5 rounded-full transition-all duration-500 ease-out shadow-sm"
              :style="`width: ${(selectedReq.items.filter(i => i.supplied_qty === i.requested_qty).length / selectedReq.items.length) * 100}%`"
            ></div>
          </div>
        </div>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
          <div class="max-w-4xl mx-auto space-y-6 pb-[140px]">
            
            <template x-for="category in Object.keys(groupedItems)" :key="category">
              
              <div x-data="{ open: true }" class="bg-slate-200 rounded-2xl border border-slate-400 overflow-hidden shadow-sm">
                
                <button 
                  @click="open = !open"
                  class="w-full px-6 py-4 flex items-center justify-between bg-slate-300 hover:bg-slate-400/50 transition-colors"
                >
                  <div class="flex items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-slate-600"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    <h3 class="font-bold text-lg text-slate-800 uppercase tracking-wide" x-text="category"></h3>
                    <span class="bg-slate-400/60 text-slate-800 text-xs font-bold px-2.5 py-1 rounded-full" x-text="groupedItems[category].length"></span>
                  </div>
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                      class="text-slate-600 transition-transform duration-200"
                      :class="open ? 'rotate-180' : ''">
                    <path d="m6 9 6 6 6-6"/>
                  </svg>
                </button>

                <div x-show="open" class="p-2 md:p-4 space-y-2 bg-slate-200/50">
                  <template x-for="item in groupedItems[category]" :key="item.dtl_id">
                    
                    <div 
                      :class="[
                        selectedReq.status === 'Finalizada' ? 'opacity-70' : 'hover:bg-white',
                        (item.delivered_qty + item.session_qty) >= item.requested_qty ? 'bg-emerald-50 border-emerald-400' : 
                        ((item.delivered_qty + item.session_qty) > 0 ? 'bg-amber-50 border-amber-300' : 'bg-slate-100 border-slate-300')
                      ]"
                      class="flex items-center justify-between py-2 px-3 md:px-4 rounded-xl transition-colors border gap-3 shadow-sm"
                    >
                      
                      <div class="flex items-center gap-3 min-w-0">
                        <div 
                          :class="(item.delivered_qty + item.session_qty) >= item.requested_qty ? 'bg-emerald-600 border-emerald-700' : 
                                  ((item.delivered_qty + item.session_qty) > 0 ? 'bg-amber-500 border-amber-600' : 'bg-slate-300 border-slate-400')"
                          class="flex items-center justify-center w-6 h-6 md:w-7 md:h-7 rounded-md border-2 shrink-0 transition-colors"
                        >
                          <template x-if="(item.delivered_qty + item.session_qty) >= item.requested_qty">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                          </template>
                          <template x-if="(item.delivered_qty + item.session_qty) > 0 && (item.delivered_qty + item.session_qty) < item.requested_qty">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                          </template>
                        </div>
                        
                        <div class="truncate">
                          <h3 class="text-sm md:text-base font-bold text-slate-800 truncate leading-tight" x-text="item.name"></h3>
                          <div class="flex items-center gap-3 text-[11px] md:text-xs text-slate-600 mt-0.5">
                            <span>Sol: <strong class="text-slate-900" x-text="`${item.requested_qty} ${item.unit}`"></strong></span>
                            <template x-if="item.delivered_qty > 0">
                              <span class="text-indigo-700 font-bold bg-indigo-100 px-1.5 rounded-sm">Previo: <span x-text="item.delivered_qty"></span></span>
                            </template>
                          </div>
                        </div>
                      </div>
                      
                      <div class="flex items-center gap-3 shrink-0" x-show="selectedReq.status !== 'Finalizada'">
                        
                        <button 
                          @click="fillAllItem(selectedReq.id, item.dtl_id)"
                          class="hidden md:block text-[10px] uppercase font-bold text-emerald-700 hover:text-emerald-500 tracking-wider"
                        >Todo</button>

                        <div class="flex items-center bg-slate-200/80 rounded-lg border border-slate-400 overflow-hidden h-8">
                          <button 
                            @click="updateQuantity(selectedReq.id, item.dtl_id, -1)"
                            :disabled="item.session_qty === 0"
                            class="px-3 h-full text-lg font-bold text-slate-700 hover:bg-slate-300 disabled:opacity-40 leading-none flex items-center justify-center"
                          >−</button>
                          
                          <div class="w-10 md:w-12 h-full flex items-center justify-center font-black text-sm text-slate-900 bg-slate-50 border-x border-slate-400">
                            <span x-text="item.session_qty"></span>
                          </div>
                          
                          <button 
                            @click="updateQuantity(selectedReq.id, item.dtl_id, 1)"
                            :disabled="(item.delivered_qty + item.session_qty) >= item.requested_qty"
                            class="px-3 h-full text-lg font-bold text-slate-700 hover:bg-slate-300 disabled:opacity-40 leading-none flex items-center justify-center"
                          >+</button>
                        </div>
                      </div>

                    </div>
                  </template>
                </div>

              </div>
            </template>
            
          </div>
        </div>

        <div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-slate-300 via-slate-300/90 to-transparent z-20">
          <div class="max-w-4xl mx-auto">
            <button
              :disabled="orderStatus === 'pending' || orderStatus === 'empty' || selectedReq.status === 'Finalizada'"
              @click="markAsFinished(selectedReq.id)"
              :class="[
                (orderStatus === 'pending' || orderStatus === 'empty' || selectedReq.status === 'Finalizada') ? 'bg-slate-400 text-slate-600 cursor-not-allowed shadow-inner border border-slate-500' : '',
                orderStatus === 'complete' && selectedReq.status !== 'Finalizada' ? 'bg-emerald-700 text-white hover:bg-emerald-800 hover:shadow-xl hover:-translate-y-1 border border-emerald-900' : '',
                orderStatus === 'partial' && selectedReq.status !== 'Finalizada' ? 'bg-amber-600 text-white hover:bg-amber-700 hover:shadow-xl hover:-translate-y-1 border border-amber-800' : ''
              ]"
              class="w-full py-5 rounded-2xl text-xl font-bold shadow-md transition-all duration-300 flex items-center justify-center gap-3"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
              <span x-text="
                selectedReq.status === 'Finalizada' ? 'Pedido Entregado' : 
                (orderStatus === 'complete' ? 'Finalizar Pedido Completo' : 
                (orderStatus === 'partial' ? 'Finalizar con Faltantes' : 'Comienza a surtir para finalizar'))
              "></span>
            </button>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
    <script type="module" src="{% static 'js/app_requisicion/app_requisicion.js' %}"></script>
{% endblock %}
