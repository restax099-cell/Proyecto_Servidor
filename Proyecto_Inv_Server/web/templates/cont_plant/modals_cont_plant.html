<!-- Modal Nueva Plantilla (Diseño oscuro y limpio) -->
<div class="modal fade" id="modalNuevaPlantilla" tabindex="-1" aria-labelledby="modalNuevaPlantillaLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            
            <!-- Encabezado Oscuro -->
            <div class="modal-header bg-dark text-white border-bottom-0">
                <h5 class="modal-title fw-semibold fs-6" id="modalNuevaPlantillaLabel">Crear nueva plantilla</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <!-- Cuerpo del Modal -->
            <div class="modal-body p-4 bg-white">
                
                <!-- Nombre de la plantilla -->
                <div class="mb-4">
                    <label class="form-label fw-bold text-dark mb-1">Nombre de la plantilla</label>
                    <input type="text" class="form-control" 
                           x-model="formulario.nombre" 
                           placeholder="Ej. Conteo diario - cocina">
                </div>

                <!-- Almacén a contar -->
                <div class="mb-4">
                    <label class="form-label fw-bold text-dark mb-1">Almacén a contar</label>
                    <select class="form-select" x-model="formulario.store">
                        <option value="" disabled selected>Selecciona un almacén...</option>
                        <template x-for="s in stores" :key="s.id">
                            <option :value="s.id" x-text="s.store"></option>
                        </template>
                    </select>
                </div>

                <!-- Responsables de captura (Dropdown Dinámico) -->
                <div class="mb-2">
                    <label class="form-label fw-bold text-dark mb-1">Responsables de captura</label>
                    <select class="form-select" x-model="formulario.user_id">
                        <option value="" disabled selected>Selecciona al responsable...</option>
                        <template x-for="usuario in usuarios" :key="usuario.id">
                            <option :value="usuario.id" x-text="usuario.username"></option>
                        </template>
                    </select>
                </div>

            </div>
            
            <!-- Pie del Modal (Fondo gris claro) -->
            <div class="modal-footer bg-light border-top-0 py-3">
                <button type="button" class="btn btn-white border px-4" data-bs-dismiss="modal">Cancelar</button>
                <!-- Se removió data-bs-dismiss="modal" de este botón -->
                <button type="button" class="btn btn-dark px-4" 
                        @click="iniciarEdicionNueva()">
                    Comenzar a configurar
                </button>
            </div>
            
        </div>
    </div>
</div>


<!-- Modal Buscar y Agregar Catálogos -->
<div class="modal fade" id="modalCatalogos" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow">
            
            <div class="modal-header bg-dark text-white border-bottom-0">
                <h5 class="modal-title fw-semibold fs-6">Seleccionar Catálogos</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <div class="modal-body p-4 bg-white">
                <!-- Buscador que dispara la API al teclear -->
                <div class="mb-3 position-relative">
                    <input type="text" class="form-control" placeholder="Buscar por nombre o código..."
                           x-model="searchCatalogo" 
                           @keyup.debounce.500ms="buscarCatalogos()">
                </div>
                
                <!-- Tabla de resultados con scroll interno -->
                <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light sticky-top">
                            <tr>
                                <th style="width: 15%">CÓDIGO</th>
                                <th style="width: 50%">CATEGORÍA</th>
                                <th style="width: 15%" class="text-center">ITEMS</th>
                                <th style="width: 20%" class="text-end">ACCIÓN</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Iteramos sobre la respuesta de la API -->
                            <template x-for="cat in catalogosDisponibles" :key="cat.categoria_id">
                                <tr>
                                    <td class="fw-bold text-dark" x-text="cat.catalogo"></td>
                                    <td x-text="cat.categoria"></td>
                                    <td class="text-center">
                                        <span class="badge bg-light text-dark border" x-text="cat.cant_items"></span>
                                    </td>
                                    <td class="text-end">
                                        <!-- Botón inteligente: Cambia de estado si ya se agregó -->
                                        <button type="button" class="btn btn-sm fw-bold" 
                                                :class="isCatalogoAgregado(cat.categoria_id) ? 'btn-success disabled' : 'btn-dark'"
                                                @click="agregarCatalogo(cat)">
                                            <span x-text="isCatalogoAgregado(cat.categoria_id) ? 'Agregado ✓' : 'Agregar +'"></span>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                            
                            <!-- Mensaje si no hay resultados -->
                            <tr x-show="catalogosDisponibles.length === 0">
                                <td colspan="4" class="text-center py-4 text-muted">
                                    No se encontraron catálogos con esa búsqueda.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="modal-footer bg-light border-top-0 py-3">
                <button type="button" class="btn btn-dark px-4" data-bs-dismiss="modal">Terminar y cerrar</button>
            </div>
            
        </div>
    </div>
</div>


<!-- MODAL GENERAL DE ALERTAS Y CONFIRMACIONES -->
<!-- MODAL GENERAL DE ALERTAS Y CONFIRMACIONES -->
<div class="modal fade" id="modalAlertaGeneral" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <!-- MODIFICACIÓN AQUÍ: Sombra grande, borde sutil y sombra difuminada más intensa -->
        <div class="modal-content border shadow-lg rounded-4" style="box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.35) !important; border-color: rgba(0,0,0,0.1) !important;">
            <div class="modal-body text-center p-4">
                
                <!-- ICONOS DINÁMICOS SEGÚN EL TIPO DE ALERTA -->
                <!-- 1. Faltan Datos / Advertencia (Warning) -->
                <template x-if="alerta.tipo === 'warning'">
                    <div class="text-warning mb-3">
                        <svg width="48" height="48" fill="currentColor" class="bi bi-exclamation-circle-fill" viewBox="0 0 16 16">
                            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM8 4a.905.905 0 0 0-.9.995l.35 3.507a.552.552 0 0 0 1.1 0l.35-3.507A.905.905 0 0 0 8 4zm.002 6a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/>
                        </svg>
                    </div>
                </template>

                <!-- 2. Errores (Danger) -->
                <template x-if="alerta.tipo === 'danger'">
                    <div class="text-danger mb-3">
                        <svg width="48" height="48" fill="currentColor" class="bi bi-x-circle-fill" viewBox="0 0 16 16">
                            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293 5.354 4.646z"/>
                        </svg>
                    </div>
                </template>

                <!-- 3. Confirmación / Pregunta (Confirm) -->
                <template x-if="alerta.tipo === 'confirm'">
                    <div class="text-primary mb-3">
                        <svg width="48" height="48" fill="currentColor" class="bi bi-question-circle-fill" viewBox="0 0 16 16">
                            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM5.496 6.033h.825c.138 0 .248-.113.266-.25.09-.656.54-1.134 1.342-1.134.686 0 1.314.343 1.314 1.168 0 .635-.374.927-.965 1.371-.673.489-1.206 1.06-1.168 1.987l.003.217a.25.25 0 0 0 .25.246h.811a.25.25 0 0 0 .25-.25v-.105c0-.718.273-.927 1.01-1.486.609-.463 1.244-.977 1.244-2.056 0-1.511-1.276-2.241-2.673-2.241-1.267 0-2.655.59-2.75 2.286a.237.237 0 0 0 .241.247zm2.325 6.443c.6 0 1.057-.438 1.057-1.054 0-.624-.457-1.06-1.057-1.06-.61 0-1.068.436-1.068 1.06 0 .616.458 1.054 1.068 1.054z"/>
                        </svg>
                    </div>
                </template>

                <!-- 4. Éxito / Guardado Correcto (Success) -->
                <template x-if="alerta.tipo === 'success'">
                    <div class="text-success mb-3">
                        <svg width="48" height="48" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                        </svg>
                    </div>
                </template>

                <!-- TEXTOS DINÁMICOS -->
                <h5 class="fw-bold text-dark mb-2" x-text="alerta.titulo"></h5>
                <p class="text-muted small mb-4" x-text="alerta.mensaje"></p>

                <!-- BOTONES DE ACCIÓN -->
                <div class="d-flex justify-content-center gap-2">
                    <template x-if="alerta.tipo === 'confirm'">
                        <button type="button" class="btn btn-sm btn-light border px-3" data-bs-dismiss="modal">Cancelar</button>
                    </template>

                    <button type="button" 
                            class="btn btn-sm px-4 fw-medium text-white" 
                            :class="{
                                'btn-warning text-dark': alerta.tipo === 'warning',
                                'btn-danger': alerta.tipo === 'danger',
                                'btn-success': alerta.tipo === 'success',
                                'btn-primary': alerta.tipo === 'confirm'
                            }"
                            @click="alerta.tipo === 'confirm' || alerta.tipo === 'success' ? confirmarAccion() : cerrarAlertaUnica()"
                            x-text="alerta.textoBoton">
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>
