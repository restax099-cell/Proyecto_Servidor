<div x-show="modalFormType === 'item'" x-transition>


    

    <!-- Ficha Financiera -->
    <div class="p-4 bg-light">
        <p class="fw-bold text-uppercase text-secondary mb-3" style="font-size:11px; letter-spacing:.08em;">Ficha Financiera (Precios)</p>

        <div class="mb-3" style="max-width: 50%;">
            <label class="form-label fw-semibold">Tipo de Precio</label>
            <select x-model="ficha.tipo_precio" class="form-select">
                <option value="">Omitir Precios (Opcional)</option>
                <option value="Menudeo">Menudeo</option>
                <option value="Mayoreo">Mayoreo</option>
            </select>
        </div>

        <div :class="ficha.tipo_precio === '' ? 'opacity-50 pointer-events-none' : ''" class="transition-all">
            <div class="row g-3 mb-3 pt-3 border-top">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Precio de Venta</label>
                    <input type="number" step="0.01" x-model.number="ficha.precio" placeholder="0.00" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Margen Objetivo (%)</label>
                    <input type="number" step="0.01" x-model.number="ficha.utilidad" placeholder="Ej. 35" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Moneda</label>
                    <select x-model="ficha.moneda" class="form-select">
                        <option value="MXN">MXN</option>
                        <option value="USD">USD</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Impuesto (IVA)</label>
                    <div class="d-flex gap-2">
                        <select x-model="ivaType" class="form-select">
                            <option value="0.16">16% (Predeterminado)</option>
                            <option value="0.00">Exento (0%)</option>
                            <option value="custom">Personalizado...</option>
                        </select>
                        <input
                            x-show="ivaType === 'custom'"
                            x-cloak
                            type="number" step="0.01"
                            x-model.number="ficha.tasa_cuota"
                            placeholder="0.08"
                            class="form-control"
                            style="width: 90px;">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
