<!-- CONTENEDOR PRINCIPAL -->
<div class="modal-body p-0" style="max-height: 70vh; overflow-y: auto; overflow-x: hidden;">
    

        <!-- NOMBRE -->
        <div class="mb-3">
            <label class="form-label fw-semibold" x-text="getNombreLabel()"></label>
            <input x-show="modalFormType === 'item'" type="text" x-model="newItem.nombre" class="form-control" :placeholder="getPlaceholderText()">
            <input x-show="modalFormType === 'brand'" type="text" x-model="newBrand.nombre" class="form-control" :placeholder="getPlaceholderText()">
        </div>

        <!-- Sku & Barcode (SKU y Código de Barras) -->
        <div class="row g-3 mb-3" x-show="modalFormType === 'item'">
            
            <!-- SKU -->
            <div class="col-md-6">
                <label class="form-label fw-semibold">SKU / Código</label>
                <input type="text" x-model="newItem.codigo" @input="skuModificadoManualmente = true" class="form-control">
            </div>

            <!-- Código de Barras -->
            <div class="col-md-6">
                <label class="form-label fw-semibold">Código de Barras</label>
                <div class="input-group">
                    <input type="text" x-model="newItem.barcode" class="form-control" placeholder="Escanear o generar...">
                    
                    <button class="btn btn-outline-secondary px-3 d-flex align-items-center" type="button" title="Código de Barras" @click="activarCamara()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 5v14"></path>
                            <path d="M8 5v14"></path>
                            <path d="M12 5v14"></path>
                            <path d="M17 5v14"></path>
                            <path d="M21 5v14"></path>
                        </svg>
                    </button>
                </div>
            </div>
            
        </div>

        <!-- Category & Brands -->
        <div class="row g-3 mb-3">
            
            <!-- Columna: Categoría de Item (Solo Item) -->
            <div class="col-md-6" x-show="modalFormType === 'item'">
                <label class="form-label fw-semibold">Categoría</label>
                <div class="d-flex gap-2">
                    <div class="position-relative flex-grow-1" @click.outside="cerrarDropdown('categoria')">
                        <div class="input-group">
                            <input type="text" x-model="modalLocalSearch" @focus="modalOpenCategoryDropdown = true" @input="modalOpenCategoryDropdown = true; debounceBuscador('categoria', $event.target.value)" @keydown.escape="cerrarDropdown('categoria')" :placeholder="(categories.find(c => c.id === newItem.id_categoria) || {}).name || 'Buscar categoría...'" class="form-control">
                            <button type="button" @click="modalOpenCategoryDropdown = !modalOpenCategoryDropdown; if(modalOpenCategoryDropdown) $el.previousElementSibling.focus()" class="btn btn-outline-secondary px-2">▼</button>
                        </div>
                        <div x-show="modalOpenCategoryDropdown" class="dropdown-menu show position-absolute w-100 mt-1 shadow border rounded" style="max-height: 200px; overflow-y: auto; z-index: 1060;" x-cloak>
                            <template x-for="cat in categories" :key="cat.id">
                                <button type="button" @click="seleccionarDropdown('categoria', cat.id)" class="dropdown-item py-2 small" :class="newItem.id_categoria === cat.id ? 'bg-light fw-bold text-dark' : ''">
                                    <span x-text="cat.code ? cat.code + ' - ' + cat.name : cat.name"></span>
                                </button>
                            </template>
                        </div>
                    </div>
                    
                    <button type="button" x-show="newItem.id_categoria" @click="openCrud('category'); $nextTick(() => { const cat = categories.find(c => c.id == newItem.id_categoria); if(cat) editCrudItem(cat); });" class="btn btn-outline-secondary px-3 d-flex align-items-center justify-content-center" title="Editar Categoría Seleccionada">
                        <span class="fw-bold fs-5" style="line-height: 1;">✎</span>
                    </button>
                    <button type="button" @click="openCrud('category')" class="btn btn-dark px-3 d-flex align-items-center justify-content-center" title="Administrar Categorías">
                        <span class="fw-bold fs-5" style="line-height: 1;">+</span>
                    </button>
                </div>
            </div>

            <!-- Columna: Marca (Solo Item) -->
            <div class="col-md-6" x-show="modalFormType === 'item'">
                <label class="form-label fw-semibold">Marca</label>
                <div class="d-flex gap-2">
                    <div class="position-relative flex-grow-1" @click.outside="cerrarDropdown('marca')">
                        <div class="input-group">
                            <input type="text" x-model="modalLocalSearchBrand" @focus="modalOpenBrandDropdown = true" @input="modalOpenBrandDropdown = true; debounceBuscador('marca', $event.target.value)" @keydown.escape="cerrarDropdown('marca')" :placeholder="(brands.find(b => b.id === newItem.id_brand) || {}).name || 'Buscar marca...'" class="form-control">
                            <button type="button" @click="modalOpenBrandDropdown = !modalOpenBrandDropdown; if(modalOpenBrandDropdown) $el.previousElementSibling.focus()" class="btn btn-outline-secondary px-2">▼</button>
                        </div>
                        <div x-show="modalOpenBrandDropdown" class="dropdown-menu show position-absolute w-100 mt-1 shadow border rounded" style="max-height: 200px; overflow-y: auto; z-index: 1060;" x-cloak>
                            <template x-for="brand in brands" :key="brand.id">
                                <button type="button" @click="seleccionarDropdown('marca', brand.id)" class="dropdown-item py-2 small" :class="newItem.id_brand === brand.id ? 'bg-light fw-bold text-dark' : ''">
                                    <span x-text="brand.name"></span>
                                </button>
                            </template>
                        </div>
                    </div>
                    
                    <button type="button" x-show="newItem.id_brand" @click="openEditModal(brands.find(b => b.id == newItem.id_brand || b.brand_id == newItem.id_brand), 'brand')" class="btn btn-outline-secondary px-3 d-flex align-items-center justify-content-center" title="Editar Marca Seleccionada">
                        <span class="fw-bold fs-5" style="line-height: 1;">✎</span>
                    </button>
                    <button type="button" @click="abrirModalRegistro('brand')" class="btn btn-dark px-3 d-flex align-items-center justify-content-center" title="Nueva Marca">
                        <span class="fw-bold fs-5" style="line-height: 1;">+</span>
                    </button>
                </div>
            </div>

            <!-- Columna: Categoría de Marca (Solo Marca) -->
            <div class="col-12" x-show="modalFormType === 'brand'">
                <label class="form-label fw-semibold">Categoría de Marca</label>
                <div class="d-flex gap-2">
                    <div class="position-relative flex-grow-1" @click.outside="cerrarDropdown('categoria_marca')">
                        <div class="input-group">
                            <input type="text" x-model="modalLocalSearchBrandCat" @focus="modalOpenBrandCatDropdown = true" @input="modalOpenBrandCatDropdown = true; debounceBuscador('categoria_marca', $event.target.value)" @keydown.escape="cerrarDropdown('categoria_marca')" :placeholder="(brandCategories.find(bc => bc.id == newBrand.id_brandcategory) || {}).name || 'Buscar categoría de marca...'" class="form-control">
                            <button type="button" @click="modalOpenBrandCatDropdown = !modalOpenBrandCatDropdown; if(modalOpenBrandCatDropdown) $el.previousElementSibling.focus()" class="btn btn-outline-secondary px-2">▼</button>
                        </div>
                        <div x-show="modalOpenBrandCatDropdown" class="dropdown-menu show position-absolute w-100 mt-1 shadow border rounded" style="max-height: 200px; overflow-y: auto; z-index: 1070;" x-cloak>
                            <template x-for="bcat in brandCategories" :key="bcat.id">
                                <button type="button" @click="seleccionarDropdown('categoria_marca', bcat.id)" class="dropdown-item py-2 small" :class="newBrand.id_brandcategory == bcat.id ? 'bg-light fw-bold text-dark' : ''">
                                    <span x-text="bcat.name"></span>
                                </button>
                            </template>
                        </div>
                    </div>
                    
                    <button type="button" x-show="newBrand.id_brandcategory" @click="openCrud('brandCategory'); $nextTick(() => { const bcat = brandCategories.find(bc => bc.id == newBrand.id_brandcategory); if(bcat) editCrudItem(bcat); });" class="btn btn-outline-secondary px-3 d-flex align-items-center justify-content-center" title="Editar Categoría de Marca">
                        <span class="fw-bold fs-5" style="line-height: 1;">✎</span>
                    </button>
                    <button type="button" @click="openCrud('brandCategory')" class="btn btn-dark px-3 d-flex align-items-center justify-content-center" title="Administrar Categorías de Marca">
                        <span class="fw-bold fs-5" style="line-height: 1;">+</span>
                    </button>
                </div>
            </div>
            
        </div>

        <!-- Descriotion -->
        <div class="mb-3">
            <label class="form-label fw-semibold">Descripción</label>
            <textarea x-show="modalFormType === 'item'" rows="3" x-model="newItem.descripcion" class="form-control"></textarea>
            <textarea x-show="modalFormType === 'brand'" rows="3" x-model="newBrand.descripcion" class="form-control"></textarea>
        </div>

    <!-- Agregado fisico del item -->
    <div class="p-4 border-top" x-show="modalFormType === 'item'" x-transition>
        <p class="fw-bold text-uppercase text-secondary mb-3" style="font-size:11px; letter-spacing:.08em;">Ficha Operativa (Logística)</p>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label fw-semibold">Unidad de Medida</label>
                <!-- OJO AQUI: operationItem.unidad -->
                <select x-model.number="operationItem.unidad" class="form-select">
                    <option value="0" disabled>Selecciona...</option>
                    <option value="1">Pz</option>
                    <option value="2">Kg</option>
                    <option value="3">Litro</option>
                    <option value="4">Caja</option>
                    <option value="5">Paquete</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Cont. Empaque</label>
                <input type="number" step="0.01" x-model.number="operationItem.contenido_empaque" placeholder="1.0" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Peso (Kg/gr)</label>
                <input type="number" step="0.01" x-model.number="operationItem.peso" placeholder="0.0" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Rendimiento (%)</label>
                <input type="number" step="0.01" x-model.number="operationItem.rendimiento" placeholder="100" class="form-control">
            </div>
        </div>
    </div>

</div>
