                            </div>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2.5">Cont. Empaque</label>
                            <input type="number" step="0.01" x-model.number="ficha.contenido_empaque" class="w-full bg-[#F8FAFC] border border-slate-200 rounded-[14px] px-4 py-3 text-[14px] text-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all">

                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">

                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2.5">Rendimiento (%)</label>
                            <input type="number" step="0.01" x-model.number="ficha.rendimiento" class="w-full bg-[#F8FAFC] border border-slate-200 rounded-[14px] px-4 py-3 text-[14px] text-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all">

                                </div>

                    <span x-text="isEditingAll ? 'Guardando Cambios...' : 'Guardar Cambios'"></span>
                </button>

        <div x-show="showSuccessModal" x-transition class="bg-white w-full max-w-sm rounded-[24px] shadow-2xl p-6 flex flex-col items-center text-center relative z-10 border border-slate-100">
            
            <div class="w-16 h-16 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mb-4 border border-emerald-100 animate-bounce-short">
                <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                </svg>
            </div>
            
            <h3 class="text-slate-800 text-[20px] font-bold mb-2" x-text="successTitle"></h3>

            <button

            </button>
        </div>
